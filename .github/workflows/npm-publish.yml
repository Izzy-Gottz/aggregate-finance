name: npm-publish
# Manual only: publishing is a deliberate step in docs/releasing.md. Signs in with npm trusted publishing (no stored
# token), and npm attaches provenance on its own; --provenance makes a missing attestation fail the publish.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    # The private repo mirrors this file. npm's provenance has to name the public repo, so it never runs there.
    if: github.repository == 'Izzy-Gottz/aggregate-finance'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm trusted publishing and the provenance signature
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-cli-package.ts
      - run: npm publish --provenance --access public
        working-directory: dist/npm/aggregate-finance
