# CHALLENGE: "Make it move a dollar" (docs/launch/challenge.md). A separate app (challenge.aggregate.finance) with its
# own Neon project, open to anyone trying to break Aggregate. Made-up companies only; Plaid in sandbox; GitHub sign-in.
# AGFN_CHALLENGE=1 makes boot refuse to start if any real provider key is set (apps/server/src/challenge/guard.ts; the
# same check runs in CI against this file). Every outbound HTTP call is recorded (outbound_calls) and kept 90 days.
# Deploy: fly deploy -c fly.challenge.toml   (only after Yisrael's yes on the app, the Neon project, DNS and the GitHub
# OAuth app)
#
# Secrets (fly secrets set -a aggregate-challenge …; never in this file), and ONLY these:
#   AUTH_SECRET, AGFN_MASTER_KEY     fresh, never the live or staging app's
#   DATABASE_URL                     the challenge's own Neon project (never the live one's)
#   GITHUB_CLIENT_ID / _SECRET       the challenge's own GitHub OAuth app (callback /api/auth/callback/github)
#   PLAID_CLIENT_ID / PLAID_SECRET   SANDBOX keys only
# No email keys, no backups, no other provider: the guard refuses them.

app = "aggregate-challenge"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "node apps/server/src/release.ts"
  strategy = "immediate"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  BASE_URL = "https://challenge.aggregate.finance"
  # No pre-filled demo pool here: the challenge has its own seeded workspaces and nobody clicks "Look around".
  AGFN_DEMO_POOL = "0"
  AGFN_ROLE = "all"
  DATA_DIR = "/tmp/agfn"
  AGFN_CHALLENGE = "1"
  AGFN_HOSTED = "1"
  AGFN_PLAID_MAX_ITEMS_PER_WORKSPACE = "5"
  PLAID_ENV = "sandbox"
  DB_POOL_MAX = "5"
  AGFN_PG_RLS = "1"
  AGFN_PG_RLS_ROLE = "agfn_app"

[http_service]
  internal_port = 8787
  force_https = true
  # One machine always on: the nightly reset and the outbound log need a running process.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
