<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aggregate for Shopify · Demo</title>
<meta name="description" content="A short walkthrough of connecting a Shopify store to Aggregate.">
<!-- Unlisted: for Shopify App Store review, not for search. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F1EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0E0D" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root { --paper: #F4F1EB; --ink: #141312; --muted: #8A847A; --rule: #DDD6CA; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #0F0E0D; --ink: #E9E2D4; --muted: #7C766C; --rule: #2A2724; }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Cormorant Garamond", "Iowan Old Style", Georgia, serif; font-weight: 300;
    -webkit-font-smoothing: antialiased;
    min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto;
  }
  header, footer {
    padding: 28px clamp(16px, 4vw, 40px);
    font-size: 12px; font-weight: 400; letter-spacing: .22em; text-transform: uppercase; color: var(--muted);
  }
  header a { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 12px; }
  header svg { width: 20px; height: 20px; }
  /* A 44 px tap area around the logo link, invisible. */
  header a { position: relative; }
  header a::after { content: ""; position: absolute; inset: -12px 0; }
  main { width: 100%; max-width: 1040px; margin: 0 auto; padding: 24px 16px 40px; text-align: center; }
  h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 300; font-style: italic; line-height: 1.2; }
  p.sub { margin: 14px auto 0; max-width: 52ch; font-size: 18px; line-height: 1.5; color: var(--muted); }
  video {
    display: block; width: 100%; height: auto; margin-top: 36px;
    border: 1px solid var(--rule); background: #000; aspect-ratio: 16 / 10;
  }
  p.note { margin-top: 16px; font-size: 15px; color: var(--muted); }
  p.note a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--rule); }
</style>
</head>
<body>
<header>
  <a href="/" aria-label="Aggregate">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" aria-hidden="true"><path d="M50 12V88M50 12 33 88M50 12 67 88M50 12 16 88M50 12 84 88"/></svg>
    Aggregate
  </a>
</header>
<main>
  <h1>Aggregate for Shopify</h1>
  <p class="sub">A short walkthrough of Aggregate with a Shopify store. Recorded on a test store with a test account.</p>
  <video controls playsinline preload="metadata" muted>
    <source src="/shopify-demo/demo.webm" type="video/webm">
    Your browser can’t play this video. <a href="/shopify-demo/demo.webm">Download it</a> instead.
  </video>
  <p class="note">Questions about this app: <a href="mailto:support@aggregate.finance">support@aggregate.finance</a></p>
</main>
<footer>aggregate.finance</footer>
</body>
</html>
