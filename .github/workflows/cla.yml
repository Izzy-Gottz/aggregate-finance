# Contributor License Agreement check (see docs/legal/CLA.md).
# Asks first-time contributors to sign by commenting on their pull request and records signatures on the
# `cla-signatures` branch, never on main (main is mirrored from the maintainers' checkout, so bot commits there would
# block the next push). Does nothing while the repository is private.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: read

jobs:
  cla:
    permissions:
      actions: write
      contents: write # to write signatures to the cla-signatures branch
      pull-requests: write
      statuses: write
    if: >-
      github.event.repository.private == false &&
      (github.event_name == 'pull_request_target' ||
       (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-latest
    steps:
      # contributor-assistant/github-action v2.6.1, pinned to its commit
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/docs/legal/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: Izzy-Gottz,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for contributing to Aggregate. Before we can merge, please read the
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/docs/legal/CLA.md) and sign it by
            commenting below with exactly the sentence that follows. You keep the copyright in your work.
          custom-allsigned-prcomment: Thanks, everyone on this pull request has signed the CLA.
          lock-pullrequest-aftermerge: false
