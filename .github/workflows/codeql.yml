# Static analysis for common vulnerabilities. Public repo only: code scanning is free there, and the private source
# repo mirrors this file and skips the job.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    if: github.repository == 'Izzy-Gottz/aggregate-finance'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
